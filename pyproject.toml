[project]
name = "hosted-checkout"
version = "2.0.0"
description = "Hosted checkout page, order admin and API for connecting an ecommerce store"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "RUF"]
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003", "E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "B017", "SIM117"]
